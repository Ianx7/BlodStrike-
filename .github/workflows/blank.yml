name: Build iOS Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com $HOME/theos
        curl -LO https://github.com
        unzip master.zip
        mkdir -p $HOME/theos/sdks
        mv sdks-master/*.sdk $HOME/theos/sdks/

    - name: Compile Dylib
      env:
        THEOS: ${{ env.HOME }}/theos
      run: |
        make package FINALPACKAGE=1

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ianSakPanel-dylib
        path: .theos/obj/debug/*.dylib
